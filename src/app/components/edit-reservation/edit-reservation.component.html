<!-- breadcrumb-section -->
<div class="breadcrumb-section breadcrumb-bg">
    <div class="container">
        <div class="row">
            <div class="col-lg-8 offset-lg-2 text-center">
                <div class="breadcrumb-text">
                    <p>Get 24/7 Support</p>
                    <h1>EditReservation</h1>
                </div>
            </div>
        </div>
    </div>
</div>
<div class="row">
    <div class="col-lg-9 offset-lg-2 text-center mt-100 mb-100">
        <div class="contact-form">
            <form #editForm="ngForm" (ngSubmit)="editReservation()">
                <p *ngIf="reservation?.plat">
                    <input type="number" placeholder="Price" name="price" [(ngModel)]="reservation.plat.price" readonly>
                </p>
                <p *ngIf="reservation">
                    <input type="number" placeholder="Quantity" name="quantity" [(ngModel)]="reservation.quantity">
                </p>
                <p *ngIf="reservation">
                    <input type="date" name="date" [(ngModel)]="reservation.date">
                </p>


                <p class="mt-5"><input type="submit" value="Edit"></p>
            </form>
        </div>
    </div>
</div>
