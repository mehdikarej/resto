<!-- breadcrumb-section -->
<div class="breadcrumb-section breadcrumb-bg">
    <div class="container">
        <div class="row">
            <div class="col-lg-8 offset-lg-2 text-center">
                <div class="breadcrumb-text">
                    <p>Get 24/7 Support</p>
                    <h1>MyBasket</h1>
                </div>
            </div>
        </div>
    </div>
</div>
<table class="table">
  <thead>
    <tr>
        <th>ID</th>
        <th>PLATNAME</th>
        <th>DESCRIPTION</th>
        <th>PLATPRICE</th>
        <th>QUANTITY</th>
        <th>DATERESERVATION</th>
        <th>Actions</th>
    </tr>
  </thead> 
   <tbody>
    <tr *ngFor="let m of myReservationTabs">
        <td>{{m.id}}</td>
        <td>{{m.name}}</td>
        <td>{{m.description}}</td>
        <td>{{m.price}}</td>
        <td>{{m.quantity}}</td>
        <td>{{m.date}}</td>
        <td><button  class="btn btn-danger" (click)="deleteReservation(m.id)">Delete</button></td>
    </tr>
   </tbody>
